<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinIF 人工质量审核</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">FinIF 人工审核 · 2026-09-18 · 20 条试批</p>
      <h1>FinIF 专家审核</h1>
    </div>
    <div class="toolbar">
      <a class="nav-link" href="../">历史审核页面</a>
      <div class="mode-switch" role="group" aria-label="审核实验">
        <button id="modeQuality" type="button">实验一：数据质量</button>
        <button id="modeConstraint" type="button">实验二：Constraint 抽取</button>
      </div>
      <label class="annotator">
        标注者
        <select id="annotatorSelect">
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="A3">A3</option>
        </select>
      </label>
      <button id="downloadBtn" type="button">导出 CSV</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="progress-card">
        <div id="modeSummary" class="mode-summary"></div>
        <div class="progress-title">审核进度</div>
        <div id="progressText" class="progress-text">0 / 20</div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
      <div id="itemList" class="item-list"></div>
    </aside>

    <section class="content">
      <nav class="item-nav">
        <button id="prevBtn" type="button">上一题</button>
        <span id="itemCounter"></span>
        <button id="nextBtn" type="button">下一题</button>
      </nav>

      <article class="item-panel">
        <div class="meta-grid" id="metaGrid"></div>

        <section class="block">
          <h2>完整 Prompt（标注依据）</h2>
          <p id="promptHint" class="hint"></p>
          <pre id="fullPromptText" class="full-prompt"></pre>
        </section>

        <section class="block">
          <h2>Constraints（生成时规划）</h2>
          <p id="constraintsHint" class="hint"></p>
          <div id="constraintsBox" class="constraints"></div>
        </section>
      </article>
    </section>

    <aside class="rating-panel">
      <h2 id="ratingTitle">评分</h2>
      <p id="ratingHint" class="hint"></p>
      <div id="ratingForm" class="rating-form"></div>
      <label class="comments-label" for="commentsInput">备注</label>
      <textarea id="commentsInput" rows="6" placeholder="任一维度给 1-3 分时，请简单写原因。"></textarea>
      <div class="autosave">自动保存到当前浏览器</div>
    </aside>
  </main>

  <script src="items.js?v=exp2-20260918"></script>
  <script src="app.js?v=exp2-20260918"></script>
</body>
</html>
